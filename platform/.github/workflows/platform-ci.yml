name: Pulse Platform CI

on:
  pull_request:
    paths: ["platform/**"]
  push:
    branches: ["main"]
    paths: ["platform/**"]

jobs:
  identity:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/services/identity } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  account:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/services/account } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: mvn -B test package

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  admin:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/apps/admin } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platform/apps/desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check
