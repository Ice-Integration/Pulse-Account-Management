[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"

[project]
name="pulse-ai-service"
version="1.0.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","openai>=1.50","asyncpg>=0.29","pgvector>=0.3","pydantic-settings>=2.5","mcp>=2.0.0"]

[tool.setuptools.packages.find]
include=["app*"]
