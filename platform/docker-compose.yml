services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports: ["5432:5432"]
    volumes:
      - pulse_pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./infra/postgres/migrations/002_production_features.sql:/docker-entrypoint-initdb.d/002-production.sql:ro
      - ./infra/postgres/migrations/003_identity_security.sql:/docker-entrypoint-initdb.d/003-identity-security.sql:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/004-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  identity:
    build: ./services/identity
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse
      JWT_SECRET: dev-secret-change-me
      PORT: 4001
    ports: ["4001:4001"]
    depends_on:
      postgres:
        condition: service_healthy

  account:
    build: ./services/account
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pulse
      SPRING_DATASOURCE_USERNAME: pulse
      SPRING_DATASOURCE_PASSWORD: pulse
      SERVER_PORT: 8081
      PULSE_SERVICE_KEY: ${SERVICE_KEY:-dev-service-key-change-me}
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy

  billing:
    build: ./services/billing
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse
      PORT: 4003
      SERVICE_KEY: ${SERVICE_KEY:-dev-service-key-change-me}
    ports: ["4003:4003"]
    depends_on:
      postgres:
        condition: service_healthy

  notification:
    build: ./services/notification
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  ai:
    build: ./services/ai
    environment:
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    ports: ["8002:8002"]
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./services/gateway
    environment:
      PORT: 4000
      JWT_SECRET: dev-secret-change-me
      SERVICE_KEY: ${SERVICE_KEY:-dev-service-key-change-me}
      IDENTITY_URL: http://identity:4001
      ACCOUNT_URL: http://account:8081
      BILLING_URL: http://billing:4003
      AI_URL: http://ai:8002
    ports: ["4000:4000"]
    depends_on: [identity, account, billing, ai]

volumes:
  pulse_pg:
