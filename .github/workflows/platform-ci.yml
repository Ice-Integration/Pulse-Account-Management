name: Pulse Platform CI

on:
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform-ci.yml'
  push:
    branches: [main]
    paths:
      - 'platform/**'

jobs:
  node-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, gateway, billing, notification]
    defaults:
      run:
        working-directory: platform/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  java-account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/account
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test package

  python-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m compileall app

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f platform/docker-compose.yml config
