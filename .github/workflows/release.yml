name: Pulse Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  service-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, account, gateway, billing, notification, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: platform/services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pulse-${{ matrix.service }}:${{ github.ref_name }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}/pulse-{1}:latest', github.repository_owner, matrix.service) || '' }}

  web-builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - working-directory: platform/apps/${{ matrix.app }}
        run: npm install
      - working-directory: platform/apps/${{ matrix.app }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.app }}-${{ github.ref_name }}
          path: platform/apps/${{ matrix.app }}/dist

  mobile-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - working-directory: platform/apps/mobile
        run: npm install
      - working-directory: platform/apps/mobile
        run: npx expo export --platform all --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mobile-export-${{ github.ref_name }}
          path: platform/apps/mobile/dist

  release-summary:
    runs-on: ubuntu-latest
    needs: [service-images, web-builds, mobile-validation]
    steps:
      - run: echo "Release artifacts built. App-store signing and production deployment require environment-specific credentials."
