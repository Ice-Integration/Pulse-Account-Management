name: AI Evals

on:
  pull_request:
    paths:
      - 'platform/services/ai/**'
      - '.github/workflows/ai-evals.yml'
  push:
    branches: [main]
    paths:
      - 'platform/services/ai/**'
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live RAG evals using OPENAI_API_KEY
        required: true
        default: false
        type: boolean

jobs:
  offline-safety-evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python evals/run.py

  live-rag-evals:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PULSE_AI_BASE_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v4
      - name: Require OpenAI secret
        run: test -n "$OPENAI_API_KEY"
      - name: Start AI evaluation stack
        working-directory: platform
        run: docker compose up -d --build postgres ai
      - name: Wait for AI service
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8002/health; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
      - name: Run live RAG evaluation
        working-directory: platform/services/ai
        run: python evals/run.py
      - name: Show service logs on failure
        if: failure()
        working-directory: platform
        run: docker compose logs ai postgres
